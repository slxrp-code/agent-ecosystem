databases:
  - name: agent-ecosystem-db
    databaseName: agent_ecosystem
    plan: free

services:
  - type: web
    name: agent-ecosystem
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agent-ecosystem-db
          property: connectionString
