<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slxrp · Agent Ecosystem</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b14;--surface:#0e1422;--surface2:#151d2e;
  --border:#1e2a40;--border2:#2a3a55;
  --text:#e2e8f4;--text2:#7a8ca8;--text3:#4a5a72;
  --accent:#2563eb;--accent2:#1d4ed8;
  --gold:#f59e0b;--gold2:#d97706;
  --green:#10b981;--red:#ef4444;--radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-brand{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.nav-brand span{color:var(--gold)}
.nav-actions{display:flex;gap:8px}
.btn{padding:7px 16px;border-radius:7px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.1)}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border)}
.sidebar-section{padding:12px 12px 4px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.orc-card{margin:8px 10px;padding:12px 14px;background:linear-gradient(135deg,#1a1400,#241c00);border:1px solid rgba(245,158,11,.25);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.orc-card:hover,.orc-card.active{border-color:var(--gold);background:linear-gradient(135deg,#221a00,#2e2300)}
.orc-card-header{display:flex;align-items:center;gap:8px}
.orc-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.orc-name{font-size:13px;font-weight:700;color:var(--gold)}
.orc-role{font-size:10px;color:var(--text3);margin-top:1px}
.orc-badge{margin-top:8px;font-size:10px;color:rgba(245,158,11,.7);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.15);border-radius:4px;padding:2px 7px;display:inline-block}
.agent-list{padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
.agent-card{padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.agent-card:hover,.agent-card.active{border-color:var(--border2);background:#1a2235}
.agent-card-header{display:flex;align-items:center;gap:8px}
.agent-avatar{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.agent-name{font-size:13px;font-weight:600}
.agent-role{font-size:10px;color:var(--text3);margin-top:1px}
.agent-caps{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.cap-tag{font-size:9px;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.05);color:var(--text3);border:1px solid var(--border)}
.empty-agents{padding:20px;text-align:center;color:var(--text3);font-size:12px;line-height:1.7}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3)}
.welcome-icon{font-size:48px}
.welcome h2{font-size:18px;color:var(--text2);font-weight:600}
.welcome p{font-size:13px;max-width:300px;text-align:center;line-height:1.6}
.agent-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface);flex-shrink:0}
.agent-header-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.agent-header-info{flex:1}
.agent-header-name{font-size:15px;font-weight:700}
.agent-header-role{font-size:12px;color:var(--text3)}
.agent-header-actions{display:flex;gap:6px}
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.msg{display:flex;gap:10px;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.msg-bubble{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6}
.msg.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.msg.assistant .msg-bubble{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg.user .msg-avatar{background:var(--accent)}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text3);font-size:13px}
.chat-empty-icon{font-size:32px}
.chat-input-wrap{padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;flex-shrink:0}
.chat-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;resize:none;outline:none;font-family:inherit;max-height:120px;min-height:40px}
.chat-input:focus{border-color:var(--accent)}
.chat-send-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:16px;transition:background .15s;flex-shrink:0}
.chat-send-btn:hover{background:var(--accent2)}
.chat-send-btn:disabled{opacity:.5;cursor:not-allowed}
.typing-indicator{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce .8s infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.caps-panel{border-top:1px solid var(--border);padding:12px 20px;background:var(--surface);flex-shrink:0}
.caps-panel-header{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.caps-list{display:flex;flex-wrap:wrap;gap:5px}
.cap-chip{font-size:11px;padding:3px 8px;border-radius:4px;background:rgba(37,99,235,.12);color:#60a5fa;border:1px solid rgba(37,99,235,.25)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-backdrop.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:28px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:700;margin-bottom:20px}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-input,.form-textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:90px}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-swatch.selected{border-color:#fff;transform:scale(1.15)}
.caps-input-row{display:flex;gap:6px;margin-bottom:8px}
.caps-tags{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.cap-removable{display:flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px 3px 10px;border-radius:4px;background:rgba(37,99,235,.12);color:#60a5fa;border:1px solid rgba(37,99,235,.25)}
.cap-remove{background:none;border:none;color:#60a5fa;cursor:pointer;font-size:13px;padding:0;line-height:1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-brand">🧠 <span>slxrp</span> ecosystem</div>
  <div class="nav-actions">
    <button class="btn btn-ghost" onclick="openEditModal()">&#9881; Edit Agent</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ New Agent</button>
  </div>
</nav>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">Command</div>
    <div class="orc-card" id="orcCard" onclick="selectAgent('orchestrator')">
      <div class="orc-card-header">
        <div class="orc-avatar">🧠</div>
        <div><div class="orc-name">Orchestrator</div><div class="orc-role">Main Command · All agents</div></div>
      </div>
      <div class="orc-badge">Business First · Always On</div>
    </div>
    <div class="sidebar-section">Agents</div>
    <div class="agent-list" id="agentList">
      <div class="empty-agents">No agents yet.<br>Click + New Agent to deploy one.</div>
    </div>
  </aside>
  <main class="main" id="mainPanel">
    <div class="welcome">
      <div class="welcome-icon">🌐</div>
      <h2>Welcome to your Ecosystem</h2>
      <p>Select the Orchestrator or an Agent from the sidebar to begin.</p>
    </div>
  </main>
</div>

<!-- Add Modal -->
<div class="modal-backdrop hidden" id="addModal">
  <div class="modal">
    <h2>+ New Agent</h2>
    <div class="form-field"><label>Agent Name</label><input class="form-input" id="addName" placeholder="e.g. Research Agent"></div>
    <div class="form-field"><label>Role / Specialty</label><input class="form-input" id="addRole" placeholder="e.g. Market Research Specialist"></div>
    <div class="form-field"><label>Avatar Color</label><div class="color-row" id="colorRow"></div></div>
    <div class="form-field">
      <label>Instructions — What does this agent do? How should they think?</label>
      <textarea class="form-textarea" id="addPrompt" placeholder="e.g. You specialize in researching market trends, identifying hot products, analyzing costs and competition. Always provide: demand signal, estimated margin, top competitors, and a go/no-go recommendation."></textarea>
    </div>
    <div class="form-field">
      <label>Capabilities — what can this agent do?</label>
      <div class="caps-input-row">
        <input class="form-input" id="capInput" placeholder="e.g. market trend analysis" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addCap()}">
        <button class="btn btn-ghost" onclick="addCap()">Add</button>
      </div>
      <div class="caps-tags" id="capTags"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewAgent()">Deploy Agent</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-backdrop hidden" id="editModal">
  <div class="modal">
    <h2>&#9881; Edit Agent</h2>
    <input type="hidden" id="editId">
    <div class="form-field"><label>Agent Name</label><input class="form-input" id="editName"></div>
    <div class="form-field"><label>Role / Specialty</label><input class="form-input" id="editRole"></div>
    <div class="form-field"><label>Avatar Color</label><div class="color-row" id="editColorRow"></div></div>
    <div class="form-field"><label>Instructions</label><textarea class="form-textarea" id="editPrompt" style="min-height:120px"></textarea></div>
    <div class="form-field">
      <label>Capabilities</label>
      <div class="caps-input-row">
        <input class="form-input" id="editCapInput" placeholder="Add capability..." style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addEditCap()}">
        <button class="btn btn-ghost" onclick="addEditCap()">Add</button>
      </div>
      <div class="caps-tags" id="editCapTags"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deleteCurrentAgent()">Delete Agent</button>
      <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEditAgent()">Save Changes</button>
    </div>
  </div>
</div>

<script>
const COLORS=['#3b82f6','#8b5cf6','#ec4899','#10b981','#f59e0b','#ef4444','#06b6d4','#6366f1'];
let agents=[],selectedId=null,addCaps=[],editCaps=[],selAddColor=COLORS[0],selEditColor=COLORS[0];

async function init(){await loadAgents();renderSwatches('colorRow',true);renderSwatches('editColorRow',false)}

async function loadAgents(){const r=await fetch('/agents');agents=await r.json();renderSidebar()}

function renderSidebar(){
  const list=document.getElementById('agentList');
  if(!agents.length){list.innerHTML='<div class="empty-agents">No agents yet.<br>Click + New Agent to deploy one.</div>';return}
  list.innerHTML=agents.map(a=>`
    <div class="agent-card${selectedId===a.id?' active':''}" onclick="selectAgent('${a.id}')">
      <div class="agent-card-header">
        <div class="agent-avatar" style="background:${a.color}">${a.name[0].toUpperCase()}</div>
        <div><div class="agent-name">${a.name}</div><div class="agent-role">${a.role}</div></div>
      </div>
      ${a.capabilities.length?`<div class="agent-caps">${a.capabilities.slice(0,3).map(c=>`<span class="cap-tag">${c}</span>`).join('')}${a.capabilities.length>3?`<span class="cap-tag">+${a.capabilities.length-3}</span>`:''}</div>`:''}
    </div>`).join('');
}

async function selectAgent(id){
  selectedId=id;
  document.getElementById('orcCard').classList.toggle('active',id==='orchestrator');
  renderSidebar();
  if(id==='orchestrator') renderOrcPanel();
  else{const a=agents.find(x=>x.id===id);if(a)renderAgentPanel(a)}
  await loadMessages(id);
}

function renderOrcPanel(){
  document.getElementById('mainPanel').innerHTML=`
    <div class="agent-header">
      <div class="agent-header-avatar" style="background:linear-gradient(135deg,#f59e0b,#d97706)">🧠</div>
      <div class="agent-header-info"><div class="agent-header-name">Main Orchestrator</div><div class="agent-header-role">Command Center · Knows all agents · Business First</div></div>
      <div class="agent-header-actions"><button class="btn btn-ghost" onclick="clearChat('orchestrator')">Clear Chat</button></div>
    </div>
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages"><div class="chat-empty"><div class="chat-empty-icon">🧠</div>Orchestrator is ready.</div></div>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chatInput" placeholder="Message the Orchestrator..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()">&#9658;</button>
      </div>
    </div>`;
}

function renderAgentPanel(a){
  document.getElementById('mainPanel').innerHTML=`
    <div class="agent-header">
      <div class="agent-header-avatar" style="background:${a.color}">${a.name[0].toUpperCase()}</div>
      <div class="agent-header-info"><div class="agent-header-name">${a.name}</div><div class="agent-header-role">${a.role}</div></div>
      <div class="agent-header-actions">
        <button class="btn btn-ghost" onclick="openEditModalFor('${a.id}')">&#9881; Edit</button>
        <button class="btn btn-ghost" onclick="clearChat('${a.id}')">Clear Chat</button>
      </div>
    </div>
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages"><div class="chat-empty"><div class="chat-empty-icon">${a.name[0].toUpperCase()}</div>${a.name} is ready.</div></div>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chatInput" placeholder="Message ${a.name}..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()">&#9658;</button>
      </div>
    </div>
    ${a.capabilities.length?`<div class="caps-panel"><div class="caps-panel-header">Capabilities <button class="btn btn-ghost" style="font-size:10px;padding:2px 8px" onclick="openEditModalFor('${a.id}')">Edit</button></div><div class="caps-list">${a.capabilities.map(c=>`<span class="cap-chip">${c}</span>`).join('')}</div></div>`:''}`;
}

async function loadMessages(id){
  const r=await fetch(`/agents/${id}/messages`);const msgs=await r.json();
  const c=document.getElementById('chatMessages');if(!c||!msgs.length)return;
  c.innerHTML=msgs.map(m=>msgHtml(m.role,m.content)).join('');
  c.scrollTop=c.scrollHeight;
}

function msgHtml(role,content){
  if(role==='user')return`<div class="msg user"><div class="msg-avatar" style="background:#2563eb">U</div><div><div class="msg-bubble">${esc(content)}</div></div></div>`;
  const isOrc=selectedId==='orchestrator';
  const a=isOrc?null:agents.find(x=>x.id===selectedId);
  const av=isOrc?'background:linear-gradient(135deg,#f59e0b,#d97706)':`background:${a?.color||'#3b82f6'}`;
  const lbl=isOrc?'🧠':(a?.name[0]||'A');
  return`<div class="msg assistant"><div class="msg-avatar" style="${av}">${lbl}</div><div><div class="msg-bubble">${fmt(content)}</div></div></div>`;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
function fmt(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:12px">$1</code>').replace(/\n/g,'<br>')}

async function sendMessage(){
  const input=document.getElementById('chatInput');
  const btn=document.getElementById('sendBtn');
  const msg=input.value.trim();
  if(!msg||!selectedId)return;
  input.value='';btn.disabled=true;
  const c=document.getElementById('chatMessages');
  if(c.querySelector('.chat-empty'))c.innerHTML='';
  c.innerHTML+=msgHtml('user',msg);
  const isOrc=selectedId==='orchestrator';
  const a=isOrc?null:agents.find(x=>x.id===selectedId);
  const av=isOrc?'background:linear-gradient(135deg,#f59e0b,#d97706)':`background:${a?.color||'#3b82f6'}`;
  const lbl=isOrc?'🧠':(a?.name[0]||'A');
  c.innerHTML+=`<div class="msg assistant" id="typing"><div class="msg-avatar" style="${av}">${lbl}</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;
  c.scrollTop=c.scrollHeight;
  try{
    const r=await fetch(`/agents/${selectedId}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d=await r.json();
    document.getElementById('typing')?.remove();
    c.innerHTML+=msgHtml('assistant',d.response);
  }catch(e){
    document.getElementById('typing')?.remove();
    c.innerHTML+=`<div class="msg assistant"><div class="msg-bubble" style="color:#f87171">Error connecting to agent. Check API key in Render settings.</div></div>`;
  }
  c.scrollTop=c.scrollHeight;btn.disabled=false;input.focus();
}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}

async function clearChat(id){
  if(!confirm('Clear this chat history?'))return;
  await fetch(`/agents/${id}/messages`,{method:'DELETE'});
  const c=document.getElementById('chatMessages');
  if(c)c.innerHTML='<div class="chat-empty"><div class="chat-empty-icon">💬</div>Chat cleared.</div>';
}

function renderSwatches(cid,isAdd){
  const el=document.getElementById(cid);if(!el)return;
  const sel=isAdd?selAddColor:selEditColor;
  el.innerHTML=COLORS.map(c=>`<div class="color-swatch${c===sel?' selected':''}" style="background:${c}" onclick="${isAdd?'pickAddColor':'pickEditColor'}('${c}')"></div>`).join('');
}
function pickAddColor(c){selAddColor=c;renderSwatches('colorRow',true)}
function pickEditColor(c){selEditColor=c;renderSwatches('editColorRow',false)}

function addCap(){const i=document.getElementById('capInput');const v=i.value.trim();if(!v)return;if(!addCaps.includes(v))addCaps.push(v);i.value='';renderCapTags('capTags',addCaps,true)}
function addEditCap(){const i=document.getElementById('editCapInput');const v=i.value.trim();if(!v)return;if(!editCaps.includes(v))editCaps.push(v);i.value='';renderCapTags('editCapTags',editCaps,false)}
function renderCapTags(cid,caps,isAdd){const el=document.getElementById(cid);if(!el)return;el.innerHTML=caps.map((c,i)=>`<div class="cap-removable">${c}<button class="cap-remove" onclick="${isAdd?'rmAddCap':'rmEditCap'}(${i})">×</button></div>`).join('')}
function rmAddCap(i){addCaps.splice(i,1);renderCapTags('capTags',addCaps,true)}
function rmEditCap(i){editCaps.splice(i,1);renderCapTags('editCapTags',editCaps,false)}

function openAddModal(){
  addCaps=[];selAddColor=COLORS[0];
  ['addName','addRole','addPrompt','capInput'].forEach(id=>document.getElementById(id).value='');
  renderCapTags('capTags',addCaps,true);renderSwatches('colorRow',true);
  document.getElementById('addModal').classList.remove('hidden');
}
function closeAddModal(){document.getElementById('addModal').classList.add('hidden')}

async function submitNewAgent(){
  const name=document.getElementById('addName').value.trim();
  const role=document.getElementById('addRole').value.trim();
  const prompt=document.getElementById('addPrompt').value.trim();
  if(!name||!role||!prompt){alert('Please fill in name, role, and instructions.');return}
  await fetch('/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,role,color:selAddColor,system_prompt:prompt,capabilities:addCaps})});
  closeAddModal();await loadAgents();
}

function openEditModal(){
  if(!selectedId||selectedId==='orchestrator'){alert('Select an agent first.');return}
  openEditModalFor(selectedId);
}
function openEditModalFor(id){
  const a=agents.find(x=>x.id===id);if(!a)return;
  selectedId=id;editCaps=[...a.capabilities];selEditColor=a.color;
  document.getElementById('editId').value=id;
  document.getElementById('editName').value=a.name;
  document.getElementById('editRole').value=a.role;
  document.getElementById('editPrompt').value=a.system_prompt;
  document.getElementById('editCapInput').value='';
  renderSwatches('editColorRow',false);renderCapTags('editCapTags',editCaps,false);
  document.getElementById('editModal').classList.remove('hidden');
}
function closeEditModal(){document.getElementById('editModal').classList.add('hidden')}

async function submitEditAgent(){
  const id=document.getElementById('editId').value;
  const name=document.getElementById('editName').value.trim();
  const role=document.getElementById('editRole').value.trim();
  const prompt=document.getElementById('editPrompt').value.trim();
  if(!name||!role||!prompt){alert('Please fill all fields.');return}
  await fetch(`/agents/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,role,color:selEditColor,system_prompt:prompt,capabilities:editCaps})});
  closeEditModal();await loadAgents();
  const a=agents.find(x=>x.id===id);if(a)renderAgentPanel(a);await loadMessages(id);
}

async function deleteCurrentAgent(){
  const id=document.getElementById('editId').value;
  const a=agents.find(x=>x.id===id);
  if(!confirm(`Delete ${a?.name}? This removes their chat history too.`))return;
  await fetch(`/agents/${id}`,{method:'DELETE'});
  closeEditModal();selectedId=null;await loadAgents();
  document.getElementById('mainPanel').innerHTML='<div class="welcome"><div class="welcome-icon">🌐</div><h2>Agent removed</h2><p>Select another agent or create a new one.</p></div>';
}

document.getElementById('addModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeAddModal()});
document.getElementById('editModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditModal()});

init();
</script>
</body>
</html>
