<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Ecosystem</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #070b14;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

#city-map { position:relative; width:100vw; height:100vh; z-index:1; }
#roads-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

.building {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  text-align: center;
  transition: transform 0.2s ease, filter 0.2s ease;
  z-index: 10;
}
.building:hover { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.25); }
.building.active { filter: brightness(1.4); }
.building-label { margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.building-sub { font-size: 9px; color: #475569; letter-spacing: 0.08em; margin-top: 2px; }

/* Chat panel */
#chat-panel {
  position: fixed; top: 0; right: -500px; width: 460px; height: 100vh;
  background: #0b1020; border-left: 1px solid #1e2940;
  display: flex; flex-direction: column; z-index: 100;
  transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
}
#chat-panel.open { right: 0; }

#chat-header {
  padding: 18px 20px; border-bottom: 1px solid #1e2940;
  display: flex; align-items: center; gap: 12px;
}
#chat-header-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
#chat-header-info { flex: 1; }
#chat-header-name { font-size: 15px; font-weight: 700; color: #f1f5f9; }
#chat-header-role { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
#chat-actions { display: flex; gap: 8px; }
.header-btn {
  background: none; border: 1px solid #2d3748; border-radius: 6px;
  color: #64748b; cursor: pointer; font-size: 11px; padding: 4px 10px;
  transition: all 0.15s;
}
.header-btn:hover { color: #f1f5f9; border-color: #475569; }
#chat-close { background: none; border: none; color: #475569; cursor: pointer; font-size: 20px; padding: 2px 6px; }
#chat-close:hover { color: #f1f5f9; }

#chat-messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}
#chat-messages::-webkit-scrollbar { width: 3px; }
#chat-messages::-webkit-scrollbar-thumb { background: #1e2940; border-radius: 2px; }

.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; color: #e2e8f0; white-space: pre-wrap; word-break: break-word; }
.msg.user { background: #1a3050; align-self: flex-end; border-bottom-right-radius: 3px; }
.msg.assistant { background: #111827; align-self: flex-start; border-bottom-left-radius: 3px; border-left: 3px solid var(--agent-color, #3b82f6); }

.typing { background: #111827; align-self: flex-start; padding: 12px 16px; border-radius: 12px; border-bottom-left-radius: 3px; }
.dots { display: flex; gap: 5px; }
.dots span { width: 7px; height: 7px; background: #374151; border-radius: 50%; animation: bounce 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }

#chat-input-area {
  padding: 14px 18px; border-top: 1px solid #1e2940;
  display: flex; gap: 10px; align-items: flex-end;
}
#chat-input {
  flex: 1; background: #111827; border: 1px solid #2d3748; border-radius: 10px;
  padding: 10px 14px; color: #f1f5f9; font-size: 14px; resize: none;
  max-height: 120px; outline: none; font-family: inherit; line-height: 1.4;
}
#chat-input:focus { border-color: var(--agent-color, #3b82f6); }
#chat-send {
  padding: 10px 18px; border: none; border-radius: 10px;
  background: var(--agent-color, #3b82f6); color: #fff;
  font-weight: 700; cursor: pointer; font-size: 14px; transition: opacity 0.2s;
}
#chat-send:hover { opacity: 0.85; }
#chat-send:disabled { opacity: 0.35; cursor: not-allowed; }

/* Toolbar */
#toolbar {
  position: fixed; bottom: 24px; left: 24px; z-index: 50;
  display: flex; gap: 10px;
}
.tool-btn {
  background: #0f1525; border: 1px solid #1e2940; border-radius: 10px;
  padding: 10px 18px; color: #94a3b8; cursor: pointer; font-size: 13px;
  font-weight: 600; display: flex; align-items: center; gap: 7px;
  transition: all 0.2s;
}
.tool-btn:hover { background: #151e35; color: #f1f5f9; border-color: #3b82f6; }

/* City label */
#city-title {
  position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
  z-index: 50; pointer-events: none; text-align: center;
}
#city-title h1 { font-size: 11px; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase; color: #1e2940; }

/* Modal */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200;
  display: none; align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: #0b1020; border: 1px solid #1e2940; border-radius: 16px;
  padding: 28px 32px; width: 500px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
}
.modal h2 { font-size: 17px; font-weight: 700; color: #f1f5f9; margin-bottom: 22px; }
.fg { margin-bottom: 14px; }
.fg label { display: block; font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
.fg input, .fg textarea, .fg select {
  width: 100%; background: #111827; border: 1px solid #2d3748; border-radius: 8px;
  padding: 9px 12px; color: #f1f5f9; font-size: 14px; outline: none; font-family: inherit;
}
.fg input:focus, .fg textarea:focus { border-color: #3b82f6; }
.fg textarea { resize: vertical; min-height: 80px; }
.modal-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modal-row button { padding: 9px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
.btn-cancel { background: transparent; border: 1px solid #2d3748; color: #94a3b8; }
.btn-cancel:hover { border-color: #475569; color: #f1f5f9; }
.btn-primary { background: #3b82f6; border: none; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-danger { background: #dc2626; border: none; color: #fff; }
.btn-danger:hover { background: #b91c1c; }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="city-title"><h1>Agent Ecosystem</h1></div>

<div id="city-map">
  <svg id="roads-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="buildings-layer"></div>
</div>

<!-- Chat Panel -->
<div id="chat-panel">
  <div id="chat-header">
    <div id="chat-header-dot"></div>
    <div id="chat-header-info">
      <div id="chat-header-name">Agent</div>
      <div id="chat-header-role">Role</div>
    </div>
    <div id="chat-actions">
      <button class="header-btn" onclick="openEditFromChat()">Edit</button>
      <button class="header-btn" id="delete-btn" onclick="deleteCurrentAgent()">Delete</button>
    </div>
    <button id="chat-close" onclick="closeChat()">✕</button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-area">
    <textarea id="chat-input" rows="1" placeholder="Message..."></textarea>
    <button id="chat-send" onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- Add Agent Modal -->
<div class="overlay" id="add-modal">
  <div class="modal">
    <h2>+ New Agent</h2>
    <div class="fg"><label>Name</label><input id="new-name" placeholder="e.g. Agent Marcus"></div>
    <div class="fg"><label>Role</label><input id="new-role" placeholder="e.g. Financial Analyst"></div>
    <div class="fg"><label>Color</label><input type="color" id="new-color" value="#3b82f6" style="height:40px;cursor:pointer;"></div>
    <div class="fg"><label>Capabilities (comma separated)</label><input id="new-caps" placeholder="e.g. forecasting, reporting"></div>
    <div class="fg"><label>Instructions</label><textarea id="new-prompt" placeholder="Describe how this agent thinks and behaves..."></textarea></div>
    <div class="modal-row">
      <button class="btn-cancel" onclick="closeModal('add-modal')">Cancel</button>
      <button class="btn-primary" onclick="createAgent()">Add Agent</button>
    </div>
  </div>
</div>

<!-- Edit Agent Modal -->
<div class="overlay" id="edit-modal">
  <div class="modal">
    <h2>Edit Agent</h2>
    <input type="hidden" id="edit-id">
    <div class="fg"><label>Name</label><input id="edit-name"></div>
    <div class="fg"><label>Role</label><input id="edit-role"></div>
    <div class="fg"><label>Color</label><input type="color" id="edit-color" style="height:40px;cursor:pointer;"></div>
    <div class="fg"><label>Capabilities (comma separated)</label><input id="edit-caps"></div>
    <div class="fg"><label>Instructions</label><textarea id="edit-prompt" rows="5"></textarea></div>
    <div class="modal-row">
      <button class="btn-cancel" onclick="closeModal('edit-modal')">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="tool-btn" onclick="openModal('add-modal')"><span style="font-size:16px">+</span> New Agent</button>
</div>

<script>
const API = '';
let agents = [];
let currentAgentId = null;
let pathCounter = 0;

// ── Starfield ──────────────────────────────────────────────
(function() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  for (let i = 0; i < 220; i++) {
    ctx.beginPath();
    ctx.arc(Math.random()*c.width, Math.random()*c.height, Math.random()*1.3, 0, Math.PI*2);
    ctx.fillStyle = `rgba(148,163,184,${(Math.random()*0.45+0.05).toFixed(2)})`;
    ctx.fill();
  }
})();

// ── Building SVGs ──────────────────────────────────────────
function svgTownHall(c) {
  return `<svg width="96" height="108" viewBox="0 0 96 108">
    <rect x="6" y="58" width="84" height="46" fill="#131a2a" rx="2"/>
    <rect x="10" y="46" width="9" height="56" fill="#1e263a"/>
    <rect x="26" y="46" width="9" height="56" fill="#1e263a"/>
    <rect x="42" y="46" width="9" height="56" fill="#1e263a"/>
    <rect x="58" y="46" width="9" height="56" fill="#1e263a"/>
    <rect x="74" y="46" width="9" height="56" fill="#1e263a"/>
    <polygon points="0,46 48,8 96,46" fill="#1a2238"/>
    <polygon points="6,46 48,13 90,46" fill="#202840"/>
    <ellipse cx="48" cy="9" rx="15" ry="11" fill="#252e48"/>
    <ellipse cx="48" cy="7" rx="9" ry="7" fill="${c}33"/>
    <circle cx="48" cy="5" r="4" fill="${c}" opacity="0.85"/>
    <rect x="17" y="64" width="13" height="18" fill="${c}44" rx="1"/>
    <rect x="41" y="64" width="13" height="18" fill="${c}55" rx="1"/>
    <rect x="65" y="64" width="13" height="18" fill="${c}44" rx="1"/>
    <rect x="37" y="82" width="22" height="22" fill="#1a2238" rx="1"/>
  </svg>`;
}

function svgResearcher(c) {
  return `<svg width="72" height="92" viewBox="0 0 72 92">
    <rect x="8" y="36" width="56" height="54" fill="#131a2a" rx="2"/>
    <rect x="22" y="12" width="28" height="28" fill="#1a2238"/>
    <rect x="8" y="33" width="56" height="5" fill="#1e263a"/>
    <line x1="36" y1="0" x2="36" y2="13" stroke="${c}" stroke-width="2"/>
    <circle cx="36" cy="2" r="3.5" fill="${c}" opacity="0.9"/>
    <rect x="14" y="44" width="11" height="13" fill="${c}55" rx="1"/>
    <rect x="30" y="44" width="11" height="13" fill="${c}66" rx="1"/>
    <rect x="47" y="44" width="11" height="13" fill="${c}44" rx="1"/>
    <rect x="14" y="62" width="11" height="13" fill="${c}33" rx="1"/>
    <rect x="30" y="62" width="11" height="13" fill="${c}55" rx="1"/>
    <rect x="47" y="62" width="11" height="13" fill="${c}44" rx="1"/>
    <rect x="27" y="18" width="18" height="20" fill="${c}55" rx="1"/>
  </svg>`;
}

function svgStore(c) {
  return `<svg width="84" height="82" viewBox="0 0 84 82">
    <rect x="4" y="32" width="76" height="50" fill="#131a2a" rx="3"/>
    <rect x="0" y="25" width="84" height="9" fill="${c}77" rx="2"/>
    <path d="M0,34 Q10.5,27 21,34 Q31.5,27 42,34 Q52.5,27 63,34 Q73.5,27 84,34" fill="none" stroke="${c}99" stroke-width="1.5"/>
    <rect x="16" y="18" width="52" height="11" fill="#1a2238" rx="2"/>
    <rect x="10" y="40" width="60" height="26" fill="${c}1a" rx="2" stroke="${c}44" stroke-width="1"/>
    <rect x="58" y="8" width="9" height="22" fill="#1e263a"/>
    <rect x="56" y="6" width="13" height="4" fill="#252e48"/>
    <rect x="31" y="54" width="22" height="28" fill="#1a2238" rx="1"/>
    <circle cx="49" cy="68" r="2" fill="${c}88"/>
  </svg>`;
}

function svgStudio(c) {
  return `<svg width="78" height="88" viewBox="0 0 78 88">
    <rect x="5" y="30" width="68" height="58" fill="#131a2a" rx="2"/>
    <rect x="3" y="25" width="72" height="7" fill="#1a2238" rx="1"/>
    <line x1="58" y1="10" x2="58" y2="25" stroke="${c}77" stroke-width="2"/>
    <ellipse cx="58" cy="10" rx="11" ry="5.5" fill="none" stroke="${c}" stroke-width="1.5" transform="rotate(-18 58 10)"/>
    <line x1="58" y1="10" x2="65" y2="5" stroke="${c}" stroke-width="1.2"/>
    <rect x="10" y="37" width="36" height="27" fill="${c}1a" rx="2" stroke="${c}44" stroke-width="1"/>
    <circle cx="58" cy="42" r="6" fill="${c}" opacity="0.75"/>
    <circle cx="58" cy="42" r="10" fill="${c}" opacity="0.15"/>
    <rect x="50" y="54" width="17" height="10" fill="${c}33" rx="1"/>
    <rect x="27" y="66" width="24" height="22" fill="#1a2238" rx="1"/>
  </svg>`;
}

function svgDefault(c) {
  return `<svg width="68" height="82" viewBox="0 0 68 82">
    <rect x="8" y="22" width="52" height="60" fill="#131a2a" rx="2"/>
    <rect x="8" y="18" width="52" height="6" fill="#1e263a"/>
    <rect x="22" y="6" width="24" height="16" fill="#1a2238"/>
    <rect x="14" y="30" width="11" height="13" fill="${c}44" rx="1"/>
    <rect x="29" y="30" width="11" height="13" fill="${c}66" rx="1"/>
    <rect x="44" y="30" width="11" height="13" fill="${c}44" rx="1"/>
    <rect x="14" y="48" width="11" height="13" fill="${c}33" rx="1"/>
    <rect x="29" y="48" width="11" height="13" fill="${c}55" rx="1"/>
    <rect x="44" y="48" width="11" height="13" fill="${c}33" rx="1"/>
    <rect x="25" y="64" width="18" height="18" fill="#1a2238" rx="1"/>
  </svg>`;
}

function pickSVG(agent) {
  const r = (agent.role || '').toLowerCase();
  const col = agent.color || '#3b82f6';
  if (r.includes('research') || r.includes('analyst') || r.includes('intel')) return svgResearcher(col);
  if (r.includes('etsy') || r.includes('sell') || r.includes('shop') || r.includes('retail') || r.includes('ecomm')) return svgStore(col);
  if (r.includes('content') || r.includes('creator') || r.includes('media') || r.includes('studio') || r.includes('brand')) return svgStudio(col);
  return svgDefault(col);
}

// ── City Layout ────────────────────────────────────────────
function agentPositions(n) {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2 - 5;
  const rx = Math.min(window.innerWidth * 0.30, 270);
  const ry = Math.min(window.innerHeight * 0.30, 200);
  return Array.from({length: n}, (_, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2;
    return { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) };
  });
}

function drawRoad(svg, x1, y1, x2, y2, color) {
  const id = `p${pathCounter++}`;
  // Road line
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  ['x1','y1','x2','y2'].forEach((a,i) => line.setAttribute(a,[x1,y1,x2,y2][i]));
  line.setAttribute('stroke', color + '25');
  line.setAttribute('stroke-width','2');
  svg.appendChild(line);

  // Dashes
  const dash = document.createElementNS('http://www.w3.org/2000/svg','line');
  ['x1','y1','x2','y2'].forEach((a,i) => dash.setAttribute(a,[x1,y1,x2,y2][i]));
  dash.setAttribute('stroke', color + '18');
  dash.setAttribute('stroke-width','1');
  dash.setAttribute('stroke-dasharray','6 10');
  svg.appendChild(dash);

  // Animated particle
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('id', id);
  path.setAttribute('d', `M${x1},${y1} L${x2},${y2}`);
  path.setAttribute('fill','none'); path.setAttribute('stroke','none');
  svg.appendChild(path);

  const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('r','3');
  dot.setAttribute('fill', color);
  dot.setAttribute('opacity','0.7');
  const anim = document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
  anim.setAttribute('dur', (2.5 + Math.random() * 2).toFixed(1) + 's');
  anim.setAttribute('repeatCount','indefinite');
  const mp = document.createElementNS('http://www.w3.org/2000/svg','mpath');
  mp.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+id);
  anim.appendChild(mp); dot.appendChild(anim);
  svg.appendChild(dot);
}

function renderCity() {
  pathCounter = 0;
  document.getElementById('buildings-layer').innerHTML = '';
  document.getElementById('roads-svg').innerHTML = '';
  const layer = document.getElementById('buildings-layer');
  const svg   = document.getElementById('roads-svg');
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2 - 5;

  // Town Hall
  const th = document.createElement('div');
  th.className = 'building'; th.id = 'building-orchestrator';
  th.style.left = cx+'px'; th.style.top = cy+'px';
  th.innerHTML = `${svgTownHall('#f59e0b')}
    <div class="building-label" style="color:#f59e0b">Agent T.H.</div>
    <div class="building-sub">Main Orchestrator</div>`;
  th.onclick = () => openChat('orchestrator','Agent T.H.','Main Orchestrator','#f59e0b', true);
  layer.appendChild(th);

  if (!agents.length) return;
  const pos = agentPositions(agents.length);
  agents.forEach((agent, i) => {
    drawRoad(svg, pos[i].x, pos[i].y, cx, cy, agent.color || '#3b82f6');
    const div = document.createElement('div');
    div.className = 'building'; div.id = `building-${agent.id}`;
    div.style.left = pos[i].x+'px'; div.style.top = pos[i].y+'px';
    div.innerHTML = `${pickSVG(agent)}
      <div class="building-label" style="color:${agent.color||'#94a3b8'}">${agent.name}</div>
      <div class="building-sub">${agent.role}</div>`;
    div.onclick = () => openChat(agent.id, agent.name, agent.role, agent.color||'#3b82f6', false);
    layer.appendChild(div);
  });
}

// ── Chat ───────────────────────────────────────────────────
function openChat(id, name, role, color, isOrchestrator) {
  currentAgentId = id;
  const panel = document.getElementById('chat-panel');
  panel.style.setProperty('--agent-color', color);
  document.getElementById('chat-header-dot').style.background = color;
  document.getElementById('chat-header-name').textContent = name;
  document.getElementById('chat-header-role').textContent = role;
  // Hide Edit/Delete for orchestrator
  document.getElementById('chat-actions').style.display = isOrchestrator ? 'none' : 'flex';
  panel.classList.add('open');
  loadMessages(id);
  document.querySelectorAll('.building').forEach(b => b.classList.remove('active'));
  const el = document.getElementById(`building-${id}`);
  if (el) el.classList.add('active');
}

function closeChat() {
  document.getElementById('chat-panel').classList.remove('open');
  document.querySelectorAll('.building').forEach(b => b.classList.remove('active'));
  currentAgentId = null;
}

async function loadMessages(id) {
  const box = document.getElementById('chat-messages');
  box.innerHTML = '';
  try {
    const data = await fetch(`${API}/agents/${id}/messages`).then(r=>r.json());
    data.forEach(m => appendMsg(m.role, m.content));
  } catch(e) {}
}

function appendMsg(role, content) {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.className = `msg ${role}`; d.textContent = content;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg || !currentAgentId) return;
  input.value = ''; input.style.height = 'auto';
  appendMsg('user', msg);
  const box = document.getElementById('chat-messages');
  const typing = Object.assign(document.createElement('div'), {className:'typing', innerHTML:'<div class="dots"><span></span><span></span><span></span></div>'});
  box.appendChild(typing); box.scrollTop = 99999;
  document.getElementById('chat-send').disabled = true;
  try {
    const data = await fetch(`${API}/agents/${currentAgentId}/chat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg})
    }).then(r=>r.json());
    typing.remove();
    appendMsg('assistant', data.response || data.detail || 'Error');
  } catch(e) { typing.remove(); appendMsg('assistant','Connection error.'); }
  document.getElementById('chat-send').disabled = false;
}

// ── Agent CRUD ─────────────────────────────────────────────
async function loadAgents() {
  try { agents = await fetch(`${API}/agents`).then(r=>r.json()); }
  catch(e) { agents = []; }
  renderCity();
}

async function createAgent() {
  const name   = document.getElementById('new-name').value.trim();
  const role   = document.getElementById('new-role').value.trim();
  const color  = document.getElementById('new-color').value;
  const caps   = document.getElementById('new-caps').value.split(',').map(s=>s.trim()).filter(Boolean);
  const prompt = document.getElementById('new-prompt').value.trim();
  if (!name||!role||!prompt) return alert('Name, role, and instructions are required.');
  await fetch(`${API}/agents`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name,role,color,capabilities:caps,system_prompt:prompt})});
  closeModal('add-modal');
  ['new-name','new-role','new-caps','new-prompt'].forEach(id => document.getElementById(id).value='');
  await loadAgents();
}

function openEditFromChat() {
  if (!currentAgentId || currentAgentId === 'orchestrator') return;
  const a = agents.find(x => x.id === currentAgentId);
  if (!a) return;
  document.getElementById('edit-id').value    = a.id;
  document.getElementById('edit-name').value  = a.name;
  document.getElementById('edit-role').value  = a.role;
  document.getElementById('edit-color').value = a.color || '#3b82f6';
  document.getElementById('edit-caps').value  = (a.capabilities||[]).join(', ');
  document.getElementById('edit-prompt').value= a.system_prompt;
  openModal('edit-modal');
}

async function saveEdit() {
  const id   = document.getElementById('edit-id').value;
  const caps = document.getElementById('edit-caps').value.split(',').map(s=>s.trim()).filter(Boolean);
  await fetch(`${API}/agents/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      name:        document.getElementById('edit-name').value.trim(),
      role:        document.getElementById('edit-role').value.trim(),
      color:       document.getElementById('edit-color').value,
      capabilities: caps,
      system_prompt: document.getElementById('edit-prompt').value.trim()
    })});
  closeModal('edit-modal');
  await loadAgents();
}

async function deleteCurrentAgent() {
  if (!currentAgentId || currentAgentId === 'orchestrator') return;
  const a = agents.find(x => x.id === currentAgentId);
  if (!confirm(`Delete ${a?.name}? This also clears their chat history.`)) return;
  await fetch(`${API}/agents/${currentAgentId}`, {method:'DELETE'});
  closeChat();
  await loadAgents();
}

// ── Modals ─────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) o.classList.remove('open'); }));

// ── Input ──────────────────────────────────────────────────
document.getElementById('chat-input').addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
document.getElementById('chat-input').addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });

// ── Init ───────────────────────────────────────────────────
loadAgents();
window.addEventListener('resize', renderCity);
</script>
</body>
</html>
